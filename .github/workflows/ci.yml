name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The Apollo tests import the vendored fork, so the submodule is needed.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # Default groups only: dev (pytest, ruff) without the notebooks group.
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest
