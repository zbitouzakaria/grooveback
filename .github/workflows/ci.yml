name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: lint
      # ruff needs no project environment; the dev group alone skips torch.
      - run: uv sync --frozen --only-group dev
      - run: uv run --no-sync ruff check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The Apollo tests import the vendored fork, so the submodule is needed.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: test
      - run: uv sync --frozen
      - run: uv run pytest
