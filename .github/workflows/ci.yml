name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: lint
      # ruff needs no project environment; the dev group alone skips torch.
      - name: Install the dev group
        run: uv sync --frozen --only-group dev
      - name: Run ruff
        run: uv run --no-sync ruff check src tests

  test:
    # ubuntu-26.04 ships sox_ng (libsox-ng3), which crashes torchaudio 2.7.1's sox backend.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The Apollo tests import the vendored fork, so the submodule is needed.
      - name: Check out the repo and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: test
      - name: Install the locked environment
        run: uv sync --frozen
      # The musdb_eval tests encode MP3 through torchaudio's sox backend; without it they skip.
      # The runner's Microsoft package source can fail apt-get update; nothing here comes from it.
      - name: Install sox with MP3 support
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update && sudo apt-get install -y libsox-dev libsox-fmt-mp3
      - name: Run pytest
        run: uv run pytest
