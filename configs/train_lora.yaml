# python -m grooveback.cli.train_lora: LoRA fine-tune of Stable Audio 3 to restore MP3s.
# Every field is CLI-overridable, e.g. `variant=medium-base lr=5e-5`.

variant: small-music-base   # SA3 base checkpoint: small-music-base (SAME-S) or medium-base (SAME-L)
device: auto
# Training data: every item is a fresh window, coded as MP3 at a bitrate drawn from
# `bitrates`, from one source picked by weight. A source at weight 0 is not loaded.
sources:
  tracks:                 # windows of real tracks, at a random start on every draw
    dir: null             # e.g. MUSDB18-HQ's train songs, without the validation ones
    glob: "*/mixture.wav" # the files read under dir; "*.wav" for a flat folder of songs
    weight: 0.5
  remixes:                # 1 to 4 stems from random songs, summed (Apollo's recipe)
    dir: null             # MUSDB18-HQ songs: {song}/{bass,drums,other,vocals}.wav
    weight: 0.5
epoch_windows: 1884       # items per epoch, as many as the 86 songs' prepared windows: 235 steps of 8
num_workers: 8            # CPU processes drawing and coding windows while the GPU trains
valid_dir: ???
save_dir: ???             # checkpoint-{step}/ after every epoch; the best and the last are kept
mlflow_db: artifacts/mlflow.db   # local MLflow store: losses per epoch and per step
log_system_metrics: true  # GPU/CPU utilisation, memory and power in MLflow, one mean per minute
# Each training window is coded at one of these, drawn uniformly for every item; each validation
# window keeps one, drawn once into valid_dir/validation_bitrates.json. musdb_eval's six.
bitrates: [24, 32, 48, 64, 96, 128]
window_seconds: 10.0      # cut to whole latent frames: 107 frames, 9.94 s

# LoRA on the frozen transformer; the new MP3 input trains in full.
rank: 16
lora_alpha: 16            # the update is scaled by lora_alpha / rank

# AdamW as in stable-audio-3's scripts/train_lora.py.
lr: 1.0e-4
betas: [0.9, 0.95]
weight_decay: 0.01
max_grad_norm: 1.0
batch_size: 8
num_train_epochs: 1
max_train_minutes: null   # stop after the epoch that crosses this budget
seed: 0

inpaint_mask_value: 0.0   # 0 = nothing given, generate every frame (upstream's convention)
validation_timesteps: [0.1, 0.3, 0.5, 0.7, 0.9]
sample_steps: 50          # sampling steps for the best checkpoint's listening window
log_every: 10             # steps between batch_loss / seconds_per_step points

# Continue from .../checkpoint-{step}: weights, Adam's averages, step and epoch.
# The optimizer settings above replace the ones saved in the checkpoint.
resume_from_checkpoint: null

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: .

defaults:
  - override hydra/job_logging: disabled
  - _self_
