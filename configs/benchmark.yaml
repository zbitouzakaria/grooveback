# scripts/run_xp.py — the codec-restoration benchmark (ADR-0007, ADR-0011).
# Every field is CLI-overridable; that is how a GPU pod renders one slice:
#   run_xp.py device=cuda anchors=[]                    # autoencoder arms only
#   run_xp.py device=cuda autoencoders=[] anchors=[a2sb]  # a2sb only
#   run_xp.py sources=[codec] anchors=[]                # the 6 s smoke source

device: auto
sources: [codec, aerofunk, nesta]
bitrates: [32k, 64k, 128k]
autoencoders: [same-l, earvae, earvae2, codicodec]
chains: [apollo]             # each ae also renders {chain}-{ae}: ae(chain(input))
anchors: [apollo, a2sb]

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: .

defaults:
  - override hydra/job_logging: disabled
  - _self_
