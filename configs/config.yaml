# One run type exists: mode inference — restore a file or a folder of files
# with the selected model. `model` composes the method's defaults from
# configs/model/ and is how methods will be switched later (`model=dps` once
# such a yaml exists). See ADR-0002, "Configuration".

defaults:
  - model: sdedit
  - xp: null
  - _self_

mode: inference
device: auto
input: ???        # a degraded audio file, or a folder of them
output_dir: ???   # restored copies land here as {stem}_{model.name}_{noise_level}.wav

hydra:
  run:
    dir: artifacts/runs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: artifacts/multiruns/${now:%Y-%m-%d_%H-%M-%S}
