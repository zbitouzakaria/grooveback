# One run type exists: mode inference — restore a file or a folder of files
# with the selected model. `model` picks the method and its defaults from
# configs/model/: sdedit by default, or `model=roundtrip`, `model=latent-sub`.
# See ADR-0002, "Configuration".

defaults:
  - model: sdedit
  - xp: null
  - _self_

mode: inference
device: auto
input: ???        # a degraded audio file, or a folder of them
output_dir: ???   # restored copies land here, e.g. {stem}_sdedit_n0.15.wav or {stem}_roundtrip_earvae.wav

hydra:
  run:
    dir: artifacts/runs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: artifacts/multiruns/${now:%Y-%m-%d_%H-%M-%S}
