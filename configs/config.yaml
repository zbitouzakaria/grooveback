# Minimal by design. ADR-0005 has one run type — run a frozen model over a set of
# tracks and produce a level-matched comparison — so group composition would be
# scaffolding for runs that do not exist. See ADR-0002, "Configuration", for the
# pending restructure (data / autoencoder / prior / solver / degradation / eval).

defaults:
  - _self_

hydra:
  run:
    dir: artifacts/runs/${now:%Y-%m-%d_%H-%M-%S}
