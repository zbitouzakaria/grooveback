# The benchmark comparison page: the ADR-0011 kept set plus AudioSR
# (ADR-0012), one player per (source x bitrate) over the xp listen packs.
# Track labels carry their trackswitch solo key, the published-page order.
#   uv run --group notebooks python scripts/build_demo.py demo/xp/config.yaml

codec_32k:
  dir: artifacts/xp/codec/32k/listen
  tracks: &tracks
    1 - Ground Truth: original.flac
    2 - Degraded Input: input.flac
    3 - Apollo: apollo.flac
    4 - A²SB: a2sb.flac
    5 - Apollo → εar-VAE: apollo-earvae.flac
    6 - εar-VAE − MP3 damage: earvae-sub.flac
    7 - AudioSR: audiosr.flac
    8 - HP-codecX: hpcodecx.flac

codec_64k:
  dir: artifacts/xp/codec/64k/listen
  tracks: *tracks

codec_128k:
  dir: artifacts/xp/codec/128k/listen
  tracks: *tracks

aerofunk_32k:
  dir: artifacts/xp/aerofunk/32k/listen
  tracks: *tracks

aerofunk_64k:
  dir: artifacts/xp/aerofunk/64k/listen
  tracks: *tracks

aerofunk_128k:
  dir: artifacts/xp/aerofunk/128k/listen
  tracks: *tracks
