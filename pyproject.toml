[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grooveback"
version = "0.1.0"
description = "Latent generative prior over minimal and electronic music, with restoration as its first application"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "einops>=0.7",
    "pydantic>=2.7",
    "pyloudnorm>=0.1.1",
    "pedalboard>=0.9",
    "matplotlib>=3.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "huggingface-hub>=1.0",
    # Pins torch/torchaudio to ==2.7.1 for the whole project.
    "stable-audio-3",
    "fast-bss-eval>=0.1.4",
]

[tool.uv.sources]
stable-audio-3 = { git = "https://github.com/Stability-AI/stable-audio-3.git", rev = "a0b57f5483c4588f827f3552b7d5c6ca2a9687be" }
# stable-audio-3 routes linux-x86_64 torch to the cu126 index. Its marker'd
# source must be repeated here verbatim (a differing root source conflicts
# instead of winning), plus an explicit PyPI entry so the Mac split resolves
# to the plain wheel.
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pypi", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pypi", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.100",
    "ruff",
    "import-linter>=2.0",
]
notebooks = [
    "librosa>=0.10",
    "jupyterlab",
    "ipykernel>=7.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grooveback"]

[tool.ruff]
line-length = 100
# Vendored upstream code; we do not hold it to our style.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
