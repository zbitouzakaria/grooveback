[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grooveback"
version = "0.1.0"
description = "Latent generative prior over minimal and electronic music, with restoration as its first application"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "huggingface-hub>=1.0",
    "tqdm>=4.66",
    # Pins torch/torchaudio to ==2.7.1 for the whole project.
    "stable-audio-3",
    "fast-bss-eval>=0.1.4",
    "soxr>=0.5",
    "einops>=0.8",
]

[tool.uv.sources]
# Our fork: upstream a0b57f5 plus init_mix_level, which decouples the init
# audio mix from the schedule start (the sdedit theta variant, ADR-0009).
stable-audio-3 = { git = "https://github.com/zbitouzakaria/stable-audio-3.git", rev = "b0a90b91c5e2980a2e9876fc516733ece0eec797" }
# stable-audio-3 routes linux-x86_64 torch to the cu126 index. Its marker'd
# source must be repeated here verbatim (a differing root source conflicts
# instead of winning), plus an explicit PyPI entry so the Mac split resolves
# to the plain wheel.
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pypi", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pypi", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]
# The extra autoencoders benchmarked in ADR-0011. εar-VAE's model code imports
# dac and alias_free_torch; CoDiCodec is its own package. All resolve under the
# stable-audio-3 torch pin, so they run in-process (no isolated venv needed).
aes = [
    "descript-audio-codec>=1.0",
    "alias-free-torch>=0.0.6",
    "codicodec>=0.1.2",
]
notebooks = [
    "librosa>=0.10",
    "matplotlib>=3.8",
    "jupyterlab",
    "ipykernel>=7.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grooveback"]

[tool.ruff]
line-length = 100
# Vendored upstream code; we do not hold it to our style.
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
